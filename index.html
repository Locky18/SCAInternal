<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#141414" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>SCA Internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink-900:#141414;
    --ink-800:#1C1C1C;
    --ink-700:#262626;
    --ink-650:#2E2E2E;
    --ink-600:#383838;
    --line:#3D3D3D;
    --line-soft:#303030;
    --paper:#F2F2F2;
    --paper-dim:#A3A3A3;
    --amber:#F2541E;
    --amber-light:#FF7A47;
    --amber-ink:#FFFFFF;
    --amber-glow:rgba(242,84,30,0.30);
    --green:#4FB07E;
    --red:#E0574B;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --shadow-sm:0 2px 8px rgba(0,0,0,0.24);
    --shadow-md:0 8px 24px rgba(0,0,0,0.32);
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(680px 420px at 50% -8%, rgba(242,84,30,0.10), transparent 60%),
      var(--ink-900);
    color:var(--paper);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  #root{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--ink-800);
    border-left:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    box-shadow:var(--shadow-md);
    position:relative;
  }
  button, input, select, textarea{ transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease), transform .1s var(--ease); }
  button{font-family:inherit;}
  a{color:var(--amber);}
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .ticket-head{
    padding:18px 20px 16px;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:relative;
  }
  .ticket-head::after{
    content:'';
    position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, transparent, var(--amber-glow), transparent);
    opacity:.7;
  }
  .ticket-head h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:0.1px;
  }
  .ticket-head .sub{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--paper-dim);
    letter-spacing:.2px;
    margin-top:2px;
  }
  .content{
    flex:1; padding:20px; padding-bottom:100px;
    animation: fadeIn .22s var(--ease);
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:var(--paper-dim);
    margin-bottom:6px;
    letter-spacing:.15px;
  }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], textarea, select{
    width:100%;
    background:var(--ink-700);
    border:1px solid var(--line);
    color:var(--paper);
    padding:13px 14px;
    border-radius:var(--radius-s);
    font-size:16px;
    font-family:inherit;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%239AA1AC' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 14px center;
    padding-right:36px;
  }
  select:disabled{ opacity:.5; }
  input:hover, select:hover{ border-color:var(--ink-600); }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--amber);
    box-shadow: 0 0 0 3px var(--amber-glow);
  }
  textarea{resize:vertical; min-height:70px;}

  .btn{
    display:block;
    width:100%;
    padding:14px 16px;
    border-radius:var(--radius-s);
    border:1px solid transparent;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    letter-spacing:.1px;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:linear-gradient(180deg, var(--amber-light), var(--amber));
    color:var(--amber-ink);
    box-shadow:0 4px 14px var(--amber-glow);
  }
  .btn-primary:active{background:#D6431A; box-shadow:none;}
  .btn-ghost{background:var(--ink-700); border-color:var(--line); color:var(--paper);}
  .btn-ghost:hover{border-color:var(--ink-600);}
  .btn-ghost:active{background:var(--ink-650);}
  .btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
  .btn-danger:active{background:rgba(224,87,75,0.12);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  .role-pick{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:24px;
  }
  .role-card{
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:20px;
    background:linear-gradient(180deg, var(--ink-700), var(--ink-650));
    cursor:pointer;
    text-align:left;
    box-shadow:var(--shadow-sm);
  }
  .role-card:hover{ border-color:var(--ink-600); transform:translateY(-1px); }
  .role-card:active{border-color:var(--amber); transform:translateY(0) scale(0.99);}
  .role-card .name{font-size:16px; font-weight:700; margin-bottom:4px;}
  .role-card .desc{font-size:13px; color:var(--paper-dim); line-height:1.4;}

  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 10px;
    margin:0 -10px;
    border-radius:var(--radius-s);
    border-bottom:1px solid var(--line-soft);
    gap:12px;
  }
  .item-row[data-action]{ cursor:pointer; }
  .item-row[data-action]:hover{ background:var(--ink-700); }
  .item-row[data-action]:active{ background:var(--ink-650); transform:scale(0.995); }
  .item-row .name{font-size:15px; font-weight:600;}
  .item-row .cat{font-size:12px; color:var(--paper-dim); margin-top:2px;}
  .price-tag{
    font-family:var(--mono);
    font-size:16.5px;
    font-weight:600;
    color:var(--green);
    white-space:nowrap;
    letter-spacing:.2px;
  }
  .unit{font-size:11px; color:var(--paper-dim); font-family:var(--mono);}

  .empty{
    text-align:center;
    padding:40px 16px;
    color:var(--paper-dim);
  }
  .empty::before{
    content:'';
    display:block;
    width:40px; height:40px;
    margin:0 auto 14px;
    border-radius:50%;
    background:var(--ink-700);
    border:1px solid var(--line);
  }
  .empty .big{font-size:15px; font-weight:600; color:var(--paper); margin-bottom:6px;}
  .empty .small{font-size:13px; line-height:1.5;}

  .banner{
    background:var(--ink-700);
    border:1px dashed var(--line);
    border-radius:var(--radius-m);
    padding:16px;
    margin-bottom:18px;
  }
  .banner .t{font-size:14px; font-weight:700; margin-bottom:4px;}
  .banner .d{font-size:13px; color:var(--paper-dim); line-height:1.55;}

  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    padding:4px 10px 4px 8px;
    border-radius:20px;
    border:1px solid;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .status-pill::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
    background:currentColor;
  }
  .status-pending{color:var(--amber); border-color:rgba(242,84,30,0.4); background:rgba(242,84,30,0.08);}
  .status-answered{color:var(--green); border-color:rgba(79,176,126,0.4); background:rgba(79,176,126,0.08);}

  .req-card{
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:14px 16px;
    margin-bottom:12px;
    background:var(--ink-700);
    box-shadow:var(--shadow-sm);
  }
  .req-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .req-card .item{font-weight:700; font-size:15px;}
  .req-card .note{font-size:13px; color:var(--paper-dim); margin-bottom:8px; line-height:1.45;}
  .req-card .meta{font-family:var(--mono); font-size:11px; color:var(--paper-dim);}

  .bottom-bar{
    position:sticky;
    bottom:0;
    background:rgba(27,31,39,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line-soft);
    padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex;
    gap:6px;
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--paper-dim);
    font-size:10.5px;
    font-weight:500;
    padding:8px 4px 6px;
    border-radius:var(--radius-s);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  .tab-btn.active{color:var(--amber); background:rgba(242,84,30,0.12);}
  .tab-btn:active{ transform:scale(0.95); }
  .tab-btn .dot{
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .badge{ position:relative; }
  .badge::after{
    content:attr(data-count);
    position:absolute;
    top:-4px; right:-10px;
    background:var(--red);
    color:white;
    font-size:10px;
    font-family:var(--mono);
    font-weight:600;
    min-width:16px;
    height:16px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
    box-shadow:0 0 0 2px var(--ink-800);
    animation: pop .25s var(--ease);
  }
  @keyframes pop{
    from{ transform:scale(0.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .link-btn{
    background:none; border:none; color:var(--amber);
    font-size:13px; font-weight:500; cursor:pointer; padding:0; text-decoration:underline;
  }
  .top-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    background:var(--ink-700); border:1px solid var(--line); color:var(--paper-dim);
    width:34px; height:34px; border-radius:var(--radius-s);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--ink-600); color:var(--paper); }
  .icon-btn:active{ transform:scale(0.94); }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:var(--ink-600); border:1px solid var(--line);
    padding:11px 18px; border-radius:24px;
    font-size:13px; font-weight:500;
    z-index:50; max-width:82%; text-align:center;
    box-shadow:var(--shadow-md);
    animation: toastIn .25s var(--ease);
  }
  @keyframes toastIn{
    from{ opacity:0; transform:translate(-50%, 8px); }
    to{ opacity:1; transform:translate(-50%, 0); }
  }
  .divider-label{
    font-size:10.5px; font-weight:600; color:var(--paper-dim); text-transform:uppercase; letter-spacing:.8px;
    margin:22px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line-soft);
  }
  ::selection{background:var(--amber); color:var(--amber-ink);}
</style>
</head>

  function selectOptionsHtml(list, selected, placeholder){
    var opts = '<option value="">' + esc(placeholder) + '</option>';
    var found = false;
    list.forEach(function(item){
      var isSel = item.toLowerCase() === (selected||'').trim().toLowerCase();
      if(isSel) found = true;
      opts += '<option value="' + esc(item) + '"' + (isSel ? ' selected' : '') + '>' + esc(item) + '</option>';
    });
    if(selected && !found){
      opts += '<option value="' + esc(selected) + '" selected>' + esc(selected) + ' (not listed)</option>';
    }
    return opts;
  }

  function makeSelectHtml(id, selected){
    return '<select id="' + id + '">' + selectOptionsHtml(VEHICLE_MAKES, selected, 'Any make') + '</select>';
  }

  function modelSelectHtml(id, make, selected){
    var models = VEHICLE_MODELS[make] || [];
    var placeholder = models.length ? 'Any model' : (make ? 'No models listed' : 'Select a make first');
    return '<select id="' + id + '"' + (models.length ? '' : ' disabled') + '>' + selectOptionsHtml(models, selected, placeholder) + '</select>';
  }

  function modelCheckboxesHtml(id, make, selectedModels){
    var models = VEHICLE_MODELS[make] || [];
    var selSet = (selectedModels || []).map(function(m){ return m.toLowerCase(); });
    if(!make){
      return '<div id="' + id + 'Wrap" class="unit" style="padding:4px 0;">Select a make first</div>';
    }
    if(!models.length){
      return '<div id="' + id + 'Wrap" class="unit" style="padding:4px 0;">No models listed for this make</div>';
    }
    var boxes = models.map(function(m){
      var boxId = id + '_' + m.replace(/[^a-zA-Z0-9]/g, '');
      var checked = selSet.indexOf(m.toLowerCase()) > -1 ? ' checked' : '';
      return '<label style="display:flex; align-items:center; gap:6px; padding:6px 0; font-size:14px; cursor:pointer;">' +
        '<input type="checkbox" class="' + id + '-model-cb" data-model="' + esc(m) + '" id="' + boxId + '"' + checked + ' style="width:16px; height:16px;" />' +
        esc(m) +
      '</label>';
    }).join('');
    return '<div id="' + id + 'Wrap" style="max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 12px; background:var(--ink-700);">' + boxes + '</div>' +
      '<div class="unit" style="margin-top:4px;">Leave all unticked for any model of this make · tick several to blanket-price them together</div>';
  }

  function getCheckedModels(id){
    var boxes = document.querySelectorAll('.' + id + '-model-cb:checked');
    var out = [];
    boxes.forEach(function(b){ out.push(b.getAttribute('data-model')); });
    return out;
  }

  function yearSelectHtml(id, selected){
    return '<select id="' + id + '">' + selectOptionsHtml(VEHICLE_YEARS, selected, 'Any year') + '</select>';
  }

  function keyTypeSelectHtml(id, selected){
    return '<select id="' + id + '">' + selectOptionsHtml(['Proximity','Bladed'], selected, 'Select key type') + '</select>';
  }

  function bindMakeModelCascade(makePrefix){
    var makeEl = document.getElementById(makePrefix + 'Make');
    var modelEl = document.getElementById(makePrefix + 'Model');
    if(makeEl && modelEl){
      makeEl.addEventListener('change', function(e){

  async function pushToGoogleCalendar(booking){
    if(!state.gcalToken) return null;
    var startISO, endISO;
    try{
      var start = new Date(booking.date + 'T' + booking.time + ':00');
      var end = new Date(start.getTime() + 60*60*1000);
      startISO = start.toISOString();
      endISO = end.toISOString();
    } catch(e){ return null; }

    var body = {
      summary: booking.customerName + ' — ' + booking.itemNote,
      location: booking.address,
      description: (booking.phone ? 'Phone: ' + booking.phone + '\n' : '') +
        (booking.vehicleMake || booking.vehicleModel ? 'Vehicle: ' + [booking.vehicleYear, booking.vehicleMake, booking.vehicleModel].filter(Boolean).join(' ') + (booking.regNumber ? ' (' + booking.regNumber.toUpperCase() + ')' : '') + '\n' : (booking.regNumber ? 'Reg: ' + booking.regNumber.toUpperCase() + '\n' : '')) +
        (booking.keyType ? 'Immobiliser type: ' + booking.keyType + '\n' : '') +
        (booking.quotedPrice != null ? 'Quoted price: £' + Number(booking.quotedPrice).toFixed(2) + ' +VAT (£' + exToInc(booking.quotedPrice).toFixed(2) + ' inc VAT)' + (booking.quotedUnit ? ' ' + booking.quotedUnit : '') + '\n' : '') +
        (booking.notes || ''),
      start: { dateTime: startISO },
      end: { dateTime: endISO }
    };

    try{
      var res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + state.gcalToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if(!res.ok) return null;
      var data = await res.json();
      return data.id || null;
    } catch(e){
      return null;
    }
  }

  async function finalizeRequestAnswer(id, price, unit){
    var req = state.requests.find(function(r){ return r.id === id; });
    if(!req) return;
    req.status = 'answered';
    req.price = price;
    req.unit = unit || '';
    req.answeredAt = Date.now();
    req.seenByStaff = false;
    var reqMake = req.vehicleMake || '';
    var reqModel = req.vehicleModel || '';
    var reqYear = req.vehicleYear || '';
    var existing = state.prices.find(function(p){
      return p.name.toLowerCase() === req.itemName.toLowerCase() &&
        vehicleMatchScore(p.vehicleMake, priceModels(p), reqMake, reqModel) >= 2;
    });
    if(existing){
      existing.price = price; existing.unit = req.unit;
      if(reqYear){ existing.vehicleYearFrom = reqYear; existing.vehicleYearTo = reqYear; }
      existing.updatedAt = Date.now();
    }
    else { state.prices.push({ id: uid(), name: req.itemName, category:'', price: price, unit: req.unit, vehicleMake: reqMake, vehicleModels: reqModel ? [reqModel] : [], vehicleYearFrom: reqYear, vehicleYearTo: reqYear, updatedAt: Date.now() }); }
    state.adjustingRequestId = null;
    await persistRequests();
    await persistPrices();
    render();
  }

  function latestLoggedCost(itemName, ctxMake, ctxModel){
    var key = itemName.trim().toLowerCase();
    var matches = state.jobLog.filter(function(j){ return j.itemName.trim().toLowerCase() === key; });
    if(!matches.length) return null;
    var scored = matches.map(function(j){ return { j: j, score: vehicleMatchScore(j.vehicleMake, j.vehicleModel, ctxMake, ctxModel) }; })
      .filter(function(s){ return s.score > 0; });
    if(!scored.length) return null;
    scored.sort(function(a,b){ return b.score - a.score || b.j.completedAt - a.j.completedAt; });
    return scored[0].j;
  }

  function vehicleMatchScore(entryMake, entryModelOrModels, ctxMake, ctxModel){
    var eMake = (entryMake||'').trim().toLowerCase();
    var models = Array.isArray(entryModelOrModels) ? entryModelOrModels : (entryModelOrModels ? [entryModelOrModels] : []);
    var eModels = models.map(function(m){ return (m||'').trim().toLowerCase(); }).filter(Boolean);
    var cMake = (ctxMake||'').trim().toLowerCase();
    var cModel = (ctxModel||'').trim().toLowerCase();
    if(!eMake && !eModels.length) return 1;
    if(eMake && cMake && eMake === cMake){
      if(eModels.length && cModel && eModels.indexOf(cModel) > -1) return 3;
      if(!eModels.length) return 2;
    }
    return 0;
  }

  function priceModels(p){
    return (p.vehicleModels && p.vehicleModels.length) ? p.vehicleModels : (p.vehicleModel ? [p.vehicleModel] : []);
  }

  function vehicleTag(make, model, year){
    var t = [year, make, model].filter(Boolean).join(' ').trim();
    return t;
  }

  function vatRate(){
    var r = parseFloat(state.config.vatRate);
    return isNaN(r) ? 20 : r;
  }

  function exToInc(ex){ return ex * (1 + vatRate()/100); }
  function incToEx(inc){ return inc / (1 + vatRate()/100); }

  function priceWithVatHtml(exVatPrice, unit){
    var inc = exToInc(exVatPrice);
    return '<div class="price-tag">£' + Number(exVatPrice).toFixed(2) + '<span style="color:var(--paper-dim); font-weight:500; font-size:11px;"> +VAT</span></div>' +

  }

  function bindVatPair(exId, incId){
    var exEl = document.getElementById(exId);
    var incEl = document.getElementById(incId);
    if(!exEl || !incEl) return;
    exEl.addEventListener('input', function(){

    });
    incEl.addEventListener('input', function(){
      var v = parseFloat(incEl.value);
      exEl.value = isNaN(v) ? '' : incToEx(v).toFixed(2);
    });
  }

  function priceYearLabel(p){
    var f = (p.vehicleYearFrom || p.vehicleYear || '').toString().trim();
    var t = (p.vehicleYearTo || p.vehicleYear || '').toString().trim();
    if(!f && !t) return '';
    if(f && t && f !== t) return f + '–' + t;
    return f || t;
  }

  function yearMatchesPriceRange(p, year){
    if(!year) return true;
    var f = p.vehicleYearFrom || p.vehicleYear || '';
    var t = p.vehicleYearTo || p.vehicleYear || '';
    if(!f && !t) return true;
    var y = parseInt(year, 10);
    var from = f ? parseInt(f, 10) : -Infinity;
    var to = t ? parseInt(t, 10) : Infinity;
    return y >= from && y <= to;
  }

  function keyTypeMatchesPrice(p, ctxKeyType){
    if(!ctxKeyType) return true;
    if(!p.keyType) return true;
    return p.keyType === ctxKeyType;
  }

  function bestPriceForName(nameKey, ctxMake, ctxModel, ctxYear, ctxKeyType){
    var candidates = state.prices.filter(function(p){ return p.name.trim().toLowerCase() === nameKey; });
    if(!candidates.length) return null;
    var scored = candidates.map(function(p){
      return {
        p: p,
        vScore: vehicleMatchScore(p.vehicleMake, priceModels(p), ctxMake, ctxModel),
        yearOk: yearMatchesPriceRange(p, ctxYear),
        keyOk: keyTypeMatchesPrice(p, ctxKeyType)
      };
    });
    var applicable = scored.filter(function(s){ return s.vScore > 0 && s.yearOk && s.keyOk; });
    if(applicable.length){
      applicable.sort(function(a,b){ return b.vScore - a.vScore; });
      return { entry: applicable[0].p };
    }
    var vehicleOkWrongYear = scored.filter(function(s){ return s.vScore > 0 && !(s.yearOk && s.keyOk); });
    if(vehicleOkWrongYear.length){
      return { wrongYear: true };
    }
    return { none: true, otherVehicleCount: candidates.length };
  }

  function combinedPriceItems(query){
    var ctx = state.vehicleContext || {};
    var map = {};
    state.prices.forEach(function(p){
      var key = p.name.trim().toLowerCase();
      map[key] = map[key] || { name: p.name, category: p.category };
    });
    state.jobLog.forEach(function(j){
      var key = j.itemName.trim().toLowerCase();
      map[key] = map[key] || { name: j.itemName, category: '' };
    });
    var items = Object.keys(map).map(function(k){
      var item = map[k];
      item.priceResult = bestPriceForName(k, ctx.make, ctx.model, ctx.year, ctx.keyType);
      item.learned = latestLoggedCost(item.name, ctx.make, ctx.model);
      return item;
    });
    if(query){
      var q = query.toLowerCase();
      items = items.filter(function(i){ return i.name.toLowerCase().indexOf(q) > -1 || (i.category||'').toLowerCase().indexOf(q) > -1; });
    } else {
      items = items.filter(function(i){ return i.priceResult && i.priceResult.entry; })
        .sort(function(a,b){ return (b.priceResult.entry.updatedAt||0) - (a.priceResult.entry.updatedAt||0); }).slice(0,8);
    }
    return items;
  }

  function viewPricesByVehicle(){
    var vs = state.vehicleSearch;
    var hasFilter = !!(vs.make || vs.model || vs.year);

    function makeModelMatch(entryMake, entryModelOrModels){
      var eMake = (entryMake||'').trim().toLowerCase();
      var models = Array.isArray(entryModelOrModels) ? entryModelOrModels : (entryModelOrModels ? [entryModelOrModels] : []);
      var eModels = models.map(function(m){ return (m||'').trim().toLowerCase(); });
      if(vs.make && eMake.indexOf(vs.make.trim().toLowerCase()) === -1) return false;
      if(vs.model){
        var q = vs.model.trim().toLowerCase();
        var anyMatch = eModels.length === 0 ? false : eModels.some(function(m){ return m.indexOf(q) > -1; });
        if(!anyMatch) return false;
      }
      return true;
    }

    var rows = '';
    if(hasFilter){
      var priceMatches = state.prices.filter(function(p){
        return (p.vehicleMake || priceModels(p).length) && makeModelMatch(p.vehicleMake, priceModels(p)) && yearMatchesPriceRange(p, vs.year);
      });
      var logMatches = state.jobLog.filter(function(j){
        return (j.vehicleMake || j.vehicleModel) && makeModelMatch(j.vehicleMake, j.vehicleModel) && (!vs.year || (j.vehicleYear||'').toString().trim() === vs.year.trim());
      });

      var priceRows = priceMatches.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); }).map(function(p){
        return '<div class="item-row">' +
          '<div><div class="name">' + esc(p.name) + '</div><div class="cat">' + esc(vehicleTag(p.vehicleMake, priceModels(p).join(' / '), priceYearLabel(p))) + ' · Price list</div></div>' +
          '<div style="text-align:right;">' + priceWithVatHtml(p.price, p.unit) + '</div>' +
        '</div>';
      }).join('');

      var logRows = logMatches.sort(function(a,b){ return b.completedAt - a.completedAt; }).map(function(j){
        return '<div class="item-row">' +
          '<div><div class="name">' + esc(j.itemName) + '</div><div class="cat">' + esc(vehicleTag(j.vehicleMake, j.vehicleModel, j.vehicleYear)) + ' · Job log · ' + new Date(j.completedAt).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'}) + '</div></div>' +
          '<div style="text-align:right;"><div class="price-tag" style="color:var(--amber);">£' + Number(j.actualCost).toFixed(2) + '</div></div>' +
        '</div>';
      }).join('');

      rows = priceRows + logRows;
    }

    return (
      '<div class="content">' +
        subTabRow() +
        '<div class="btn-row">' +
          '<div class="field" style="flex:1;"><label>Make</label>' + makeSelectHtml('vsMake', vs.make) + '</div>' +
          '<div class="field" style="flex:1;"><label>Model</label>' + modelSelectHtml('vsModel', vs.make, vs.model) + '</div>' +
          '<div class="field" style="flex:0 0 110px;"><label>Year</label>' + yearSelectHtml('vsYear', vs.year) + '</div>' +
        '</div>' +
        (!hasFilter ? (
          '<div class="empty"><div class="big">Search by vehicle</div><div class="small">Enter a make, model, or year to see everything priced or logged for it.</div></div>'
        ) : (rows || (
          '<div class="empty"><div class="big">Nothing found</div><div class="small">No prices or completed jobs match that vehicle yet.</div></div>'
        ))) +
      '</div>'
    );
  }

  function headerTitle(){
    if(!state.session) return state.config.businessName;
    if(state.view === 'staffRequestForm') return 'Request a price';
    if(state.view === 'newPrice' || state.view === 'editPrice') return state.editingPrice ? 'Edit price' : 'Add a price';
    if(state.view === 'newBooking' || state.view === 'editBooking') return (state.editingBooking && state.editingBooking.id) ? 'Edit booking' : (state.editingBooking && state.editingBooking.quotedPrice != null ? 'Book this job' : 'New booking');
    if(state.view === 'newJobLog' || state.view === 'editJobLog') return state.editingJobLog ? 'Edit job log entry' : 'Log a completed job';
    if(state.view === 'newUser' || state.view === 'editUser') return state.editingUser ? 'Edit user' : 'Add a user';
    if(state.view === 'settings') return 'Settings';
    var titles = { staffHome:'Prices', requests:'Requests', adminDashboard:'Pending requests', adminPrices:'Price list', bookings:'Bookings' };
    return titles[state.view] || state.config.businessName;
  }

  function render(){
    var root = document.getElementById('root');
    if(state.loading){
      root.innerHTML = '<div class="content"><div class="empty"><div class="big">Loading…</div></div></div>';
      return;
    }
    var body;
    if(!state.session){
      body = viewLogin();
    } else if(state.view === 'staffHome') body = viewStaffHome();
    else if(state.view === 'staffRequestForm') body = viewStaffRequestForm();
    else if(state.view === 'requests') body = viewRequestsList();
    else if(state.view === 'adminDashboard') body = viewAdminDashboard();
    else if(state.view === 'adminPrices') body = viewAdminPrices();
    else if(state.view === 'newPrice' || state.view === 'editPrice') body = viewPriceForm();
    else if(state.view === 'bookings') body = viewBookings();
    else if(state.view === 'newBooking' || state.view === 'editBooking') body = viewBookingForm();
    else if(state.view === 'newJobLog' || state.view === 'editJobLog') body = viewJobLogForm();
    else if(state.view === 'newUser' || state.view === 'editUser') body = viewUserForm();
    else if(state.view === 'settings') body = viewSettings();
    else body = viewStaffHome();

    var notifCount = notificationCount();
    root.innerHTML =
      '<div class="ticket-head">' +
        '<div style="display:flex; align-items:center; gap:10px;">' +
          (state.session ? '<img src="' + LOGO_SRC + '" alt="" style="height:28px; width:auto; flex-shrink:0;" />' : '') +
          '<div><h1>' + esc(headerTitle()) + '</h1>' + (state.session ? '<div class="sub">' + (state.session.role==='admin'?'Admin':state.session.name) + '</div>' : '') + '</div>' +
        '</div>' +
        (state.session ? (
          '<div style="display:flex; gap:8px;">' +
            '<button class="icon-btn" data-action="manualRefresh" title="Refresh now">&#8635;</button>' +
            '<button class="icon-btn ' + (notifCount ? 'badge' : '') + '" data-count="' + notifCount + '" data-action="notifBell" title="Notifications" style="' + (notifCount ? 'color:var(--amber); border-color:var(--amber);' : '') + '">&#128276;</button>' +
          '</div>'
        ) : '') +
      '</div>' +
      body +
      renderBottomBar() +
      (state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : '');

    attachHandlers();
  }

  function attachHandlers(){
    document.querySelectorAll('[data-action]').forEach(function(elm){
      elm.addEventListener('click', onAction);
    });
    var s1 = document.getElementById('searchInput');
    if(s1){
      s1.addEventListener('input', function(e){ state.search = e.target.value; render(); focusEnd('searchInput'); });
    }
    var liveVehicleFields = [
      { id:'vMake', evt:'change', set:function(v){ state.vehicleContext.make = v; state.vehicleContext.model = ''; } },
      { id:'vModel', evt:'change', set:function(v){ state.vehicleContext.model = v; } },
      { id:'vYear', evt:'change', set:function(v){ state.vehicleContext.year = v; } },
      { id:'vKeyType', evt:'change', set:function(v){ state.vehicleContext.keyType = v; } },
      { id:'vsMake', evt:'change', set:function(v){ state.vehicleSearch.make = v; state.vehicleSearch.model = ''; } },
      { id:'vsModel', evt:'change', set:function(v){ state.vehicleSearch.model = v; } },
      { id:'vsYear', evt:'change', set:function(v){ state.vehicleSearch.year = v; } }
    ];
    liveVehicleFields.forEach(function(f){
      var elm2 = document.getElementById(f.id);
      if(elm2){ elm2.addEventListener(f.evt, function(e){ f.set(e.target.value); render(); if(f.evt==='input') focusEnd(f.id); }); }
    });
    bindMakeModelCascade('b');
    bindMakeModelCascadeMulti('p');
    bindMakeModelCascade('j');
    bindVatPair('pPriceEx', 'pPriceInc');
    bindVatPair('reqPriceEx', 'reqPriceInc');
    state.requests.forEach(function(r){
      if(r.status === 'pending'){ bindVatPair('price-'+r.id, 'priceInc-'+r.id); }
    });
  }

  function focusEnd(id){
    var i = document.getElementById(id);
    if(i){ i.focus(); var v=i.value; i.value=''; i.value=v; }
  }

  async function onAction(e){
    var elm = e.currentTarget;
    var action = elm.getAttribute('data-action');

    if(action === 'pickRole'){
      state.pendingRoleForPin = elm.getAttribute('data-role');
      state.err = null;
      render();
    }
    else if(action === 'backToRoles'){
      state.pendingRoleForPin = null;
      render();
    }
    else if(action === 'submitPin'){
      var pin = (document.getElementById('pinInput')||{}).value || '';
      var role = state.pendingRoleForPin;
      var users = (state.config.users || []).filter(function(u){ return u.role === role; });
      var matchedUser = users.find(function(u){ return u.pin === pin; });
      if(!matchedUser){
        state.err = 'That PIN doesn\'t match anyone registered for this role.';
        render();
        return;
      }
      state.session = { role: role, name: matchedUser.name, userId: matchedUser.id, loggedInAt: Date.now() };
      state.view = role === 'admin' ? 'adminDashboard' : 'staffHome';
      saveSessionLocal(state.session);
      state.pendingRoleForPin = null;
      state.err = null;
      render();
    }
    else if(action === 'logout'){
      state.session = null;
      state.view = 'login';
      state.search = '';
      state.vehicleContext = { make:'', model:'', year:'', keyType:'' };
      clearSessionLocal();
      render();
    }
    else if(action === 'manualRefresh'){
      await refreshFromServer(true);
    }
    else if(action === 'notifBell'){
      if(state.session.role === 'admin'){ state.view = 'adminDashboard'; }
      else {
        state.view = 'requests';
        await markAnsweredSeen();
      }
      state.search = '';
      render();
    }
    else if(action === 'goto'){
      state.view = elm.getAttribute('data-view');
      state.search = '';
      if(state.session.role === 'staff' && state.view === 'requests'){ await markAnsweredSeen(); }
      render();
    }
    else if(action === 'openRequestForm'){
      state.view = 'staffRequestForm';
      render();
    }
    else if(action === 'bookFromPrice'){
      var itemName = elm.getAttribute('data-item');
      var priceVal2 = parseFloat(elm.getAttribute('data-price'));
      var unitVal2 = elm.getAttribute('data-unit') || '';
      var vctx = state.vehicleContext;
      state.editingBooking = {
        customerName:'', phone:'', address:'', regNumber:'',
        itemNote: itemName, quotedPrice: priceVal2, quotedUnit: unitVal2,
        date:'', time:'', notes:'',
        vehicleMake: vctx.make || '', vehicleModel: vctx.model || '', vehicleYear: vctx.year || '', keyType: vctx.keyType || ''
      };
      state.view = 'newBooking';
      render();
    }
    else if(action === 'cancelRequest'){
      state.view = 'staffHome';
      render();
    }
    else if(action === 'submitRequest'){
      var item = (document.getElementById('reqItem')||{}).value.trim();
      var note = (document.getElementById('reqNote')||{}).value.trim();
      var suggPriceExRaw = (document.getElementById('reqPriceEx')||{}).value;
      var suggPriceIncRaw = (document.getElementById('reqPriceInc')||{}).value;
      var suggPriceRaw = suggPriceExRaw !== '' ? suggPriceExRaw : (suggPriceIncRaw !== '' ? incToEx(parseFloat(suggPriceIncRaw)).toFixed(2) : '');
      var suggUnit = (document.getElementById('reqUnit')||{}).value.trim();
      if(!item){ showToast('Enter an item name first'); return; }
      var ctx = state.vehicleContext;
      var req = {
        id: uid(), itemName: item, note: note, requestedBy: state.session.name, requestedAt: Date.now(), status: 'pending',
        suggestedPrice: suggPriceRaw ? parseFloat(suggPriceRaw) : null,
        suggestedUnit: suggUnit || '',
        vehicleMake: ctx.make || '', vehicleModel: ctx.model || '', vehicleYear: ctx.year || ''
      };
      state.requests.push(req);
      await persistRequests();
      state.view = 'staffHome';
      state.search = '';
      showToast('Request sent to admin');
    }
    else if(action === 'dismissAnswered'){
      await markAnsweredSeen();
      render();
    }
    else if(action === 'answerRequest'){
      var id = elm.getAttribute('data-id');
      var priceValEx = (document.getElementById('price-'+id)||{}).value;
      var priceValInc = (document.getElementById('priceInc-'+id)||{}).value;
      var unitVal = (document.getElementById('unit-'+id)||{}).value.trim();
      var finalPrice = priceValEx !== '' ? parseFloat(priceValEx) : (priceValInc !== '' ? incToEx(parseFloat(priceValInc)) : NaN);
      if(isNaN(finalPrice)){ showToast('Enter a price first'); return; }
      await finalizeRequestAnswer(id, finalPrice, unitVal);
      showToast('Price sent back');
    }
    else if(action === 'startAdjust'){
      state.adjustingRequestId = elm.getAttribute('data-id');
      render();
    }
    else if(action === 'acceptRequest'){
      var acceptId = elm.getAttribute('data-id');
      var reqAccept = state.requests.find(function(r){ return r.id === acceptId; });
      if(!reqAccept) return;
      await finalizeRequestAnswer(acceptId, reqAccept.suggestedPrice, reqAccept.suggestedUnit || '');
      showToast('Accepted — price sent back');
    }
    else if(action === 'newPrice'){
      state.editingPrice = null;
      state.view = 'newPrice';
      render();
    }
    else if(action === 'editPrice'){
      var id2 = elm.getAttribute('data-id');
      state.editingPrice = state.prices.find(function(p){ return p.id === id2; });
      state.view = 'editPrice';
      render();
    }
    else if(action === 'cancelPriceForm'){
      state.editingPrice = null;
      state.view = 'adminPrices';
      render();
    }
    else if(action === 'savePrice'){
      var name = (document.getElementById('pName')||{}).value.trim();
      var category = (document.getElementById('pCategory')||{}).value.trim();
      var priceExRaw = (document.getElementById('pPriceEx')||{}).value;
      var priceIncRaw = (document.getElementById('pPriceInc')||{}).value;
      var priceN = priceExRaw !== '' ? parseFloat(priceExRaw) : (priceIncRaw !== '' ? incToEx(parseFloat(priceIncRaw)) : NaN);
      var unit = (document.getElementById('pUnit')||{}).value.trim();
      var pMake = (document.getElementById('pMake')||{}).value.trim();
      var pModels = getCheckedModels('pModel');
      var pYearFrom = (document.getElementById('pYearFrom')||{}).value.trim();
      var pYearTo = (document.getElementById('pYearTo')||{}).value.trim();
      var pKeyType = (document.getElementById('pKeyType')||{}).value;
      if(pYearFrom && pYearTo && parseInt(pYearFrom,10) > parseInt(pYearTo,10)){
        var swapTmp = pYearFrom; pYearFrom = pYearTo; pYearTo = swapTmp;
      }
      if(!name || isNaN(priceN)){ showToast('Name and price are required'); return; }
      var pid = elm.getAttribute('data-id');
      if(pid){
        var existingP = state.prices.find(function(p){ return p.id === pid; });
        if(existingP){ existingP.name=name; existingP.category=category; existingP.price=priceN; existingP.unit=unit; existingP.vehicleMake=pMake; existingP.vehicleModels=pModels; delete existingP.vehicleModel; existingP.vehicleYearFrom=pYearFrom; existingP.vehicleYearTo=pYearTo; delete existingP.vehicleYear; existingP.keyType=pKeyType; existingP.updatedAt=Date.now(); }
      } else {
        state.prices.push({ id: uid(), name:name, category:category, price:priceN, unit:unit, vehicleMake:pMake, vehicleModels:pModels, vehicleYearFrom:pYearFrom, vehicleYearTo:pYearTo, keyType:pKeyType, updatedAt: Date.now() });
      }
      await persistPrices();
      state.editingPrice = null;
      state.view = 'adminPrices';
      render();
      showToast('Saved');
    }
    else if(action === 'deletePrice'){
      var did = elm.getAttribute('data-id');
      state.prices = state.prices.filter(function(p){ return p.id !== did; });
      await persistPrices();
      render();
      showToast('Deleted');
    }
    else if(action === 'setPriceSubTab'){
      state.priceSubTab = elm.getAttribute('data-subtab');
      state.search = '';
      render();
    }
    else if(action === 'newJobLog'){
      state.editingJobLog = null;
      state.view = 'newJobLog';
      render();
    }
    else if(action === 'editJobLog'){
      var jid = elm.getAttribute('data-id');
      state.editingJobLog = state.jobLog.find(function(j){ return j.id === jid; });
      state.view = 'editJobLog';
      render();
    }
    else if(action === 'cancelJobLogForm'){
      state.editingJobLog = null;
      state.priceSubTab = 'log';
      state.view = 'adminPrices';
      render();
    }
    else if(action === 'deleteJobLog'){
      var jdel = elm.getAttribute('data-id');
      state.jobLog = state.jobLog.filter(function(j){ return j.id !== jdel; });
      await persistJobLog();
      render();
      showToast('Deleted');
    }
    else if(action === 'saveJobLog'){
      var jItem = (document.getElementById('jItem')||{}).value.trim();
      var jCost = parseFloat((document.getElementById('jCost')||{}).value);
      var jDate = (document.getElementById('jDate')||{}).value;
      var jNote = (document.getElementById('jNote')||{}).value.trim();
      var jMake = (document.getElementById('jMake')||{}).value.trim();
      var jModel = (document.getElementById('jModel')||{}).value.trim();
      var jYear = (document.getElementById('jYear')||{}).value.trim();
      if(!jItem || isNaN(jCost)){ showToast('Item and actual cost are required'); return; }
      var completedAt = jDate ? new Date(jDate + 'T12:00:00').getTime() : Date.now();
      var jid2 = elm.getAttribute('data-id');
      var entry;
      if(jid2){ entry = state.jobLog.find(function(j){ return j.id === jid2; }); }
      if(!entry){ entry = { id: uid() }; state.jobLog.push(entry); }
      entry.itemName = jItem;
      entry.actualCost = jCost;
      entry.completedAt = completedAt;
      entry.note = jNote;
      entry.vehicleMake = jMake;
      entry.vehicleModel = jModel;
      entry.vehicleYear = jYear;
      await persistJobLog();
      state.editingJobLog = null;
      state.priceSubTab = 'log';
      state.view = 'adminPrices';
      render();
      showToast('Job logged');
    }
    else if(action === 'askLogoutEveryone'){
      state.confirmLogoutEveryone = true;
      render();
    }
    else if(action === 'cancelLogoutEveryone'){
      state.confirmLogoutEveryone = false;
      render();
    }
    else if(action === 'confirmLogoutEveryone'){
      state.config.forceLogoutAt = Date.now();
      await persistConfig();
      state.confirmLogoutEveryone = false;
      state.session = null;
      state.view = 'login';
      state.pendingRoleForPin = null;
      clearSessionLocal();
      render();
    }
    else if(action === 'saveSettings'){
      state.config.businessName = (document.getElementById('setName')||{}).value.trim() || state.config.businessName;
      var vatVal = parseFloat((document.getElementById('setVatRate')||{}).value);
      state.config.vatRate = isNaN(vatVal) ? state.config.vatRate : vatVal;
      state.config.gcalClientId = (document.getElementById('setGcalId')||{}).value.trim();
      await persistConfig();
      render();
      showToast('Settings saved');
    }
    else if(action === 'newUser'){
      state.editingUser = null;
      state.view = 'newUser';
      render();
    }
    else if(action === 'editUser'){
      var euId = elm.getAttribute('data-id');
      state.editingUser = (state.config.users || []).find(function(u){ return u.id === euId; });
      state.view = 'editUser';
      render();
    }
    else if(action === 'cancelUserForm'){
      state.editingUser = null;
      state.view = 'settings';
      render();
    }
    else if(action === 'deleteUser'){
      var duId = elm.getAttribute('data-id');
      state.config.users = (state.config.users || []).filter(function(u){ return u.id !== duId; });
      await persistConfig();
      render();
      showToast('User removed');
    }
    else if(action === 'saveUser'){
      var uName = (document.getElementById('uName')||{}).value.trim();
      var uPin = (document.getElementById('uPin')||{}).value.trim();
      var uRole = (document.getElementById('uRole')||{}).value;
      if(!uName || !uPin){ showToast('Name and PIN are required'); return; }
      var dupId = elm.getAttribute('data-id');
      var dup = (state.config.users || []).find(function(u){ return u.role === uRole && u.pin === uPin && u.id !== dupId; });
      if(dup){ showToast('That PIN is already used by ' + dup.name + ' for this role'); return; }
      if(!state.config.users) state.config.users = [];
      if(dupId){
        var existingU = state.config.users.find(function(u){ return u.id === dupId; });
        if(existingU){ existingU.name = uName; existingU.pin = uPin; existingU.role = uRole; }
      } else {
        state.config.users.push({ id: uid(), name: uName, pin: uPin, role: uRole });
      }
      await persistConfig();
      state.editingUser = null;
      state.view = 'settings';
      render();
      showToast('User saved');
    }
    else if(action === 'connectGcal'){
      connectGoogleCalendar();
    }
    else if(action === 'newBooking'){
      state.editingBooking = null;
      state.view = 'newBooking';
      render();
    }
    else if(action === 'editBooking'){
      var bid = elm.getAttribute('data-id');
      state.editingBooking = state.bookings.find(function(b){ return b.id === bid; });
      state.view = 'editBooking';
      render();
    }
    else if(action === 'cancelBookingForm'){
      state.editingBooking = null;
      state.view = state.session.role === 'admin' ? 'bookings' : 'staffHome';
      render();
    }
    else if(action === 'deleteBooking'){
      var delId = elm.getAttribute('data-id');
      state.bookings = state.bookings.filter(function(b){ return b.id !== delId; });
      await persistBookings();
      render();
      showToast('Booking cancelled');
    }
    else if(action === 'saveBooking'){
      var custName = (document.getElementById('bName')||{}).value.trim();
      var phone = (document.getElementById('bPhone')||{}).value.trim();
      var address = (document.getElementById('bAddress')||{}).value.trim();
      var regNumber = (document.getElementById('bReg')||{}).value.trim();
      var itemNote = (document.getElementById('bItem')||{}).value.trim();
      var date = (document.getElementById('bDate')||{}).value;
      var time = (document.getElementById('bTime')||{}).value;
      var notes = (document.getElementById('bNotes')||{}).value.trim();
      var vehicleMake = (document.getElementById('bMake')||{}).value.trim();
      var vehicleModel = (document.getElementById('bModel')||{}).value.trim();
      var vehicleYear = (document.getElementById('bYear')||{}).value.trim();
      var keyType = (document.getElementById('bKeyType')||{}).value;
      if(!custName || !date || !time){ showToast('Customer, date and time are required'); return; }

      var bid2 = elm.getAttribute('data-id');
      var booking;
      if(bid2){
        booking = state.bookings.find(function(b){ return b.id === bid2; });
      }
      var carriedQuote = state.editingBooking && state.editingBooking.quotedPrice != null ? state.editingBooking.quotedPrice : null;
      var carriedQuoteUnit = state.editingBooking ? state.editingBooking.quotedUnit : '';
      if(!booking){
        booking = { id: uid(), createdAt: Date.now() };
        state.bookings.push(booking);
      }
      booking.customerName = custName;
      booking.phone = phone;
      booking.address = address;
      booking.regNumber = regNumber;
      booking.itemNote = itemNote;
      booking.date = date;
      booking.time = time;
      booking.notes = notes;
      booking.vehicleMake = vehicleMake;
      booking.vehicleModel = vehicleModel;
      booking.vehicleYear = vehicleYear;
      booking.keyType = keyType;
      if(carriedQuote != null){ booking.quotedPrice = carriedQuote; booking.quotedUnit = carriedQuoteUnit; }

      await persistBookings();

      if(state.gcalToken){
        var evId = await pushToGoogleCalendar(booking);
        if(evId){ booking.calendarEventId = evId; await persistBookings(); showToast('Booked and added to calendar'); }
        else { showToast('Booked, but calendar sync failed'); }
      } else {
        showToast('Booking saved — it\'ll sync to the calendar once Google Calendar is connected');
      }
      state.editingBooking = null;
      state.view = state.session.role === 'admin' ? 'bookings' : 'staffHome';
      render();
    }
  }

  loadAll();
  setInterval(refreshFromServer, 180000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') refreshFromServer();
  });
})();
</script>
</body>
</html>
